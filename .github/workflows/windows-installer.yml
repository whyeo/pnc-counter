name: Windows installer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]" -c installer/windows/constraints.txt
      - run: python -m ruff check src tests tools
      - run: python -m pytest
      - run: python tools/build_windows.py --bootstrap-compiler
      - name: Record installer checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/PNC-Counter-*-Setup-x64.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PNC-Counter-Windows-installer
          path: |
            dist/PNC-Counter-*-Setup-x64.exe
            dist/SHA256SUMS.txt
