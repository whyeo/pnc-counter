[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleus-analysis"
version = "0.7.0.dev2"
description = "Python nucleus segmentation and perinucleolar compartment counting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-image>=0.22,<1",
  "nd2>=0.10,<1",
  "tifffile>=2023.7.10",
  "Pillow>=10",
  "tkinterdnd2>=0.7,<1",
]

[project.optional-dependencies]
sam2 = ["torch>=2.5.1", "torchvision>=0.20.1"]
dev = ["pytest>=8", "build>=1", "ruff>=0.8"]

[project.scripts]
nucleus-analysis = "nucleus_analysis.cli:main"
pnc-counter = "nucleus_analysis.desktop_launcher:main"
nucleus-benchmark = "nucleus_analysis.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nucleus_analysis = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
